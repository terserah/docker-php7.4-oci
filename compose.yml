services:
  nginx:
    image: nginx:1.29
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./app:/var/www/html
    depends_on:
      - php
    networks:
      - appnet

  php:
    image: atmaluhur/php74-oci8:latest
    container_name: php74
    volumes:
      - ./app:/var/www/html
      - ./php/upload.ini:/usr/local/etc/php/conf.d/upload.ini
    networks:
      - appnet

  mysql:
    image: mysql:5.7
    container_name: mysql-host
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: apalahj19dk29
      MYSQL_DATABASE: db_skripsi_seankon
      MYSQL_USER: edu
      MYSQL_PASSWORD: eduedulah
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./backup.sql:/docker-entrypoint-initdb.d/backup.sql
    networks:
      - appnet

networks:
  appnet:
volumes:
  dbdata:

